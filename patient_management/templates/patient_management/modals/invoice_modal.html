<div class="modal fade" id="invoiceModal" tabindex="-1" aria-labelledby="invoiceModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="invoiceForm">
        <div class="modal-header bg-light">
          <h5 class="modal-title fw-bold" id="invoiceModalLabel">Generate Invoice</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-4">
            <h6 class="fw-bold mb-3 border-bottom pb-2">Unbilled Treatments</h6>
            <div id="invoice-treatments-list" class="bg-light p-3 border rounded" style="max-height: 200px; overflow-y: auto;">
              <!-- Loaded via AJAX -->
              <div class="text-center text-muted"><div class="spinner-border spinner-border-sm"></div> Loading...</div>
            </div>
          </div>
          
          <div class="row g-3">
            <div class="col-md-6 offset-md-6">
              <div class="card bg-light border-0 shadow-sm">
                <div class="card-body p-3">
                  <div class="row mb-2 align-items-center">
                    <div class="col-6 text-end fw-semibold">Subtotal ($):</div>
                    <div class="col-6">
                      <input type="number" class="form-control form-control-sm text-end inv-calc-field bg-white" id="inv_subtotal" step="0.01" value="0.00" readonly>
                    </div>
                  </div>
                  <div class="row mb-2 align-items-center">
                    <div class="col-6 text-end fw-semibold">Tax ($):</div>
                    <div class="col-6">
                      <input type="number" class="form-control form-control-sm text-end inv-calc-field" id="inv_tax" step="0.01" value="0.00">
                    </div>
                  </div>
                  <div class="row mb-3 align-items-center">
                    <div class="col-6 text-end fw-semibold">Discount ($):</div>
                    <div class="col-6">
                      <input type="number" class="form-control form-control-sm text-end inv-calc-field" id="inv_discount" step="0.01" value="0.00">
                    </div>
                  </div>
                  <div class="row pt-2 border-top align-items-center">
                    <div class="col-6 text-end fw-bold text-success fs-5">Grand Total:</div>
                    <div class="col-6 text-end">
                      <input type="hidden" id="inv_total" value="0">
                      <strong class="fs-4 text-success" id="display_grand_total">$0.00</strong>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveInvoiceBtn">
            <i class="bi bi-receipt me-1"></i> Generate Invoice
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
